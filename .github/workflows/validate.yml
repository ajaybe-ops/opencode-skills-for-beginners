name: Validate skills and links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate every skill and relative link
        run: node scripts/validate-skills.mjs

      - name: Fail if any SKILL.md is missing a description
        run: |
          missing=0
          while IFS= read -r f; do
            if ! grep -q '^description:' "$f"; then
              echo "::error file=$f::missing description (the model will never discover this skill)"
              missing=1
            fi
          done < <(find examples -name SKILL.md)
          exit "$missing"
