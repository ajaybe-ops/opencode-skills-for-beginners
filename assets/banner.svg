<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="OpenCode Skills for Beginners">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="1120" cy="60" r="190" fill="#a78bfa" opacity="0.10"/>
  <circle cx="120" cy="330" r="150" fill="#7dd3fc" opacity="0.08"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g transform="translate(80,74)">
      <rect x="0" y="0" width="64" height="64" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/>
      <path d="M20 22l10 10-10 10" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 44h12" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="80" y="196" fill="#e6ecff" font-size="56" font-weight="750" letter-spacing="-1.2">OpenCode Skills for Beginners</text>
    <text x="80" y="238" fill="#93a4c7" font-size="23" font-weight="450">A hands-on guide to installing, using, and writing skills — in about an hour.</text>

    <g transform="translate(80,286)">
      <rect x="0" y="0" width="214" height="40" rx="20" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.35"/>
      <text x="20" y="26" fill="#7dd3fc" font-size="17" font-weight="600">SKILL.md → on demand</text>

      <rect x="228" y="0" width="158" height="40" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="248" y="26" fill="#c4b5fd" font-size="17" font-weight="600">0 → first skill</text>

      <rect x="400" y="0" width="150" height="40" rx="20" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.35"/>
      <text x="420" y="26" fill="#f9a8d4" font-size="17" font-weight="600">MIT licensed</text>
    </g>

    <text x="1200" y="320" fill="#5a6a8c" font-size="15" text-anchor="end">no packages · no build step · just files</text>
  </g>
</svg>
